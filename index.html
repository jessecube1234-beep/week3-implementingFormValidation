<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 vs Javascript Validation</title>
    <!--Style-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Form Validation with HTML5 and Javascript</h1>
    </header>
    <main>
        <!--HTML 5 Form Validation-->
        <section>
            <h2>Form Validation with HTML5</h2>
                <form id="htmlForm">
                    <!--Username-->
                    <label>Username (Minimum of 5 Characters):</label>
                    <input type="text" id="username" name="username" minlength="5" required><br>
                    <!--Email-->
                    <label>Email:</label>
                    <input type="email" name="email" required><br>
                    <!--Password-->
                    <label>Password (Minimum of 6 Characters):</label>
                    <input type="password" name="password" minlength="6" required><br>
                    <!--Age-->
                    <label for="age">Age (Must be 18+):</label>
                    <input type="number" min="18" required><br>
                    <!--SubmitButton-->
                    <button type="submit">Submit</button> 
                </form>
        </section>
        <!--Javascript Form Validation-->
        <section>
            <h2>Form Validation with Javascript</h2>
                <!--novalidate stops this form from using the HTML5 Form Validation-->
                <form id="jsForm" novalidate>
                    <!--Username-->
                    <label>Username (Minimum of 5 characters):</label>
                    <input type="text" id="username2" name="username2" required><br>
                    <button type="submit">Submit</button>
                </form>

        </section>
    </main>
    <!--Script-->
   <script src="main.js"></script> 
</body>
</html>
